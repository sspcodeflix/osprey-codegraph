[project]
name = "osprey-codegraph"
version = "0.1.0"
description = "Code-graph platform: deterministic per-commit knowledge graphs for enterprises"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=1.2",
    "protobuf>=5.28",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
osprey = "osprey.cli:main"
osprey-gate = "osprey.gate.cli:main"
osprey-mcp = "osprey.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osprey"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
# B603: subprocess calls use argument vectors (never shell=True), which is
# the intended secure pattern here; bandit flags every such call as Low.
skips = ["B603"]
